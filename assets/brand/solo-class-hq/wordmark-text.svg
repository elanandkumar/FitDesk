<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Solo Class HQ wordmark</title>
  <desc id="desc">Solo Class in violet with HQ in a warm completion capsule.</desc>
  <defs>
    <linearGradient id="solo-word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8848FF"/>
      <stop offset="1" stop-color="#6724F9"/>
    </linearGradient>
    <linearGradient id="hq-capsule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#F06432"/>
    </linearGradient>
  </defs>
  <text x="24" y="194" fill="url(#solo-word)" font-family="Poppins, Arial, sans-serif" font-size="164" font-weight="700" letter-spacing="-5">Solo Class</text>
  <rect x="904" y="56" width="264" height="166" rx="68" fill="url(#hq-capsule)"/>
  <text x="939" y="177" fill="#FFFFFF" font-family="Poppins, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-4">HQ</text>
  <path d="M72 232H337" fill="none" stroke="#6724F9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="365" cy="232" r="10" fill="#F06432"/>
</svg>
